# Presets and multi-workspace targets example.
# Replace each workspace.host (and optional profile) before you deploy.
# Placeholder hosts match other knowledge_base examples (for example development_cluster).
bundle:
  name: presets_and_multi_workspace_targets

include:
  - resources/*.yml

targets:
  # Development target. mode: development applies defaults; presets override most of them.
  # Exception: mode: development rejects presets.trigger_pause_status: UNPAUSED.
  dev:
    default: true
    mode: development
    workspace:
      host: https://dev-workspace.cloud.databricks.com
      # Optional. Must match a section name in ~/.databrickscfg.
      # profile: my-dev
      root_path: /Workspace/bundle-examples/${bundle.name}/${bundle.target}/${workspace.current_user.short_name}
    presets:
      # Development mode requires the username (or ${workspace.current_user.short_name}) in the prefix.
      name_prefix: "[dev presets ${workspace.current_user.short_name}] "
      tags:
        env: dev
        team: examples
      trigger_pause_status: PAUSED
      jobs_max_concurrent_runs: 4
      # Only affects pipelines. This bundle has none; kept to show the preset key.
      pipelines_development: true
      # Dev only. Workspace UI can link to source. The CLI warns and deploys file copies.
      source_linked_deployment: true

  staging:
    workspace:
      host: https://staging-workspace.cloud.databricks.com
      # profile: my-staging
      root_path: /Workspace/bundle-examples/${bundle.name}/${bundle.target}
    presets:
      name_prefix: "[staging] "
      tags:
        env: staging
        team: examples
      trigger_pause_status: PAUSED
      jobs_max_concurrent_runs: 2
      pipelines_development: false
    resources:
      jobs:
        presets_demo:
          # (c) Staging-only job parameter change (parameters merge by name).
          parameters:
            - name: batch_size
              default: "50"
          # (a) Override a task by task_key (list merge).
          tasks:
            - task_key: process
              timeout_seconds: 1800

  prod:
    mode: production
    workspace:
      host: https://prod-workspace.cloud.databricks.com
      # profile: my-prod
      root_path: /Workspace/bundle-examples/${bundle.name}/${bundle.target}
    presets:
      name_prefix: "[prod] "
      tags:
        env: prod
        team: examples
      trigger_pause_status: UNPAUSED
      jobs_max_concurrent_runs: 1
      pipelines_development: false
    resources:
      jobs:
        presets_demo:
          # (a) Override a task by task_key.
          # (b) Point the task at another environment. Environment lists append on
          #     override; job clusters merge by job_cluster_key instead.
          tasks:
            - task_key: process
              timeout_seconds: 3600
              environment_key: heavy
