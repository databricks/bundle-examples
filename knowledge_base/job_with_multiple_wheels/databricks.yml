bundle:
  name: job_with_multiple_wheels

include:
  - ./resources/job.yml

workspace:
  host: https://myworkspace.cloud.databricks.com

artifacts:
  my_custom_wheel1:
    type: whl
    build: poetry build
    path: ./my_custom_wheel1

  my_custom_wheel2:
    type: whl
    build: poetry build
    path: ./my_custom_wheel2

variables:
  node_type_id:
    description: "Classic cluster node type (AWS: i3.xlarge; Azure: Standard_DS3_v2)"
    default: i3.xlarge

targets:
  dev:
    default: true
    mode: development
