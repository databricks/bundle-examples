resources:
  jobs:
    pipeline:
      name: Example AI Runtime pipeline (preprocess -> train -> evaluate)

      # Job-level parameters, referenceable by tasks as {{job.parameters.<name>}}.
      parameters:
        - name: epochs
          default: ${var.epochs}
        # A workspace directory the preprocess and evaluate tasks share. Job task
        # compute is ephemeral and not shared, so intermediate data must live in a
        # durable location (here, the bundle's workspace files tree).
        - name: shared_dir
          default: ${workspace.file_path}/shared

      environments:
        - environment_key: default
          spec:
            environment_version: "4"

      tasks:
        # 1. Data prep on serverless: writes a dataset file into the shared
        #    workspace dir and publishes its path as a task value.
        - task_key: preprocess
          environment_key: default
          spark_python_task:
            python_file: ../src/preprocess.py
            parameters:
              - "{{job.parameters.shared_dir}}"
              - "{{job.parameters.epochs}}"

        # 2. The AI Runtime training node; runs after preprocess. Note:
        #    ai_runtime_task fields do not accept {{...}} templating, so the
        #    training task reads its inputs from code_source / its command's
        #    environment rather than from task values.
        - task_key: train
          environment_key: default
          depends_on:
            - task_key: preprocess
          ai_runtime_task:
            experiment: air_runtime_pipeline
            code_source_path: ${workspace.artifact_path}/.internal/code.tgz
            deployments:
              - command_path: ${workspace.file_path}/src/command.sh
                compute:
                  accelerator_type: GPU_1xA10
                  accelerator_count: 1

        # 3. Evaluate on serverless: reads back the dataset the preprocess task
        #    wrote, using the path it published as a task value.
        - task_key: evaluate
          environment_key: default
          depends_on:
            - task_key: train
          spark_python_task:
            python_file: ../src/evaluate.py
