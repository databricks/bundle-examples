# Profile for running dbt against the fixture in this directory directly (e.g. `dbt parse` while
# editing the models — see README.md "Parsing the fixture offline"). `make test-e2e` does NOT use
# this file; it renders the template and runs dbt inside the generated project.
#   * http_path / catalog / schema come from DBT_FACTORY_* env vars, with offline-safe defaults so
#     `dbt parse` runs with no workspace. DBT_FACTORY_SCHEMA defaults to `default`.
#   * host / token are injected by the runner notebook at run time (DBT_HOST / DBT_ACCESS_TOKEN).
dbt_factory_e2e:
  target: dev
  outputs:
    dev:
      type: databricks
      method: http
      http_path: "{{ env_var('DBT_FACTORY_HTTP_PATH', '/sql/1.0/warehouses/0000000000000000') }}"
      catalog: "{{ env_var('DBT_FACTORY_CATALOG', 'main') }}"
      schema: "{{ env_var('DBT_FACTORY_SCHEMA', 'default') }}"
      host: "{{ env_var('DBT_HOST', '') }}"
      token: "{{ env_var('DBT_ACCESS_TOKEN', '') }}"
      threads: 4
