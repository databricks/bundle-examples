bundle:
  name: ci_cd_github_actions
  databricks_cli_version: ">= 1.20.0"

include:
  - resources/*.job.yml

targets:
  dev:
    default: true
    mode: development
  staging:
    mode: production
    workspace:
      # In CI, current_user is the SP, so each target has one copy in the SP home.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
