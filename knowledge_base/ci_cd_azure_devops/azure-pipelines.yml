trigger:
  branches:
    include: [main]

pr:
  branches:
    include: [main]

variables:
  cliVersion: 0.272.0
  bundleDirectory: knowledge_base/ci_cd_azure_devops

stages:
  - stage: Validate
    condition: eq(variables['Build.Reason'], 'PullRequest')
    jobs:
      - job: Validate
        steps:
          - bash: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/79467332e7a1a336e5bc86d8a412fdceda7cd62a/install.sh | sh -s -- $(cliVersion)
            displayName: Install Databricks CLI
          - bash: databricks bundle validate -t dev
            displayName: Validate bundle
            workingDirectory: $(bundleDirectory)
            env:
              DATABRICKS_AUTH_TYPE: azure-devops-oidc
              DATABRICKS_HOST: $(DATABRICKS_HOST)
              DATABRICKS_CLIENT_ID: $(DATABRICKS_CLIENT_ID)
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  - stage: Staging
    dependsOn: []
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployStaging
        environment: staging
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - bash: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/79467332e7a1a336e5bc86d8a412fdceda7cd62a/install.sh | sh -s -- $(cliVersion)
                  displayName: Install Databricks CLI
                - bash: databricks bundle deploy -t staging
                  displayName: Deploy staging
                  workingDirectory: $(bundleDirectory)
                  env:
                    DATABRICKS_AUTH_TYPE: azure-devops-oidc
                    DATABRICKS_HOST: $(DATABRICKS_HOST)
                    DATABRICKS_CLIENT_ID: $(DATABRICKS_CLIENT_ID)
                    SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  - stage: Prod
    dependsOn: Staging
    condition: succeeded()
    jobs:
      - deployment: DeployProd
        environment: prod
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - bash: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/79467332e7a1a336e5bc86d8a412fdceda7cd62a/install.sh | sh -s -- $(cliVersion)
                  displayName: Install Databricks CLI
                - bash: databricks bundle deploy -t prod
                  displayName: Deploy production
                  workingDirectory: $(bundleDirectory)
                  env:
                    DATABRICKS_AUTH_TYPE: azure-devops-oidc
                    DATABRICKS_HOST: $(DATABRICKS_HOST)
                    DATABRICKS_CLIENT_ID: $(DATABRICKS_CLIENT_ID)
                    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
