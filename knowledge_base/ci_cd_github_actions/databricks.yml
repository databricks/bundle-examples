bundle:
  name: ci_cd_github_actions
  databricks_cli_version: ">= 1.20.0"

include:
  - resources/*.job.yml

targets:
  dev:
    default: true
    mode: development
  staging:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
