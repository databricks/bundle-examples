bundle:
  name: python_wheel_poetry

include:
  - ./resources/job.yml

workspace:
  host: https://myworkspace.databricks.com

artifacts:
  default:
    type: whl
    build: poetry build

variables:
  node_type_id:
    description: "Classic cluster node type (AWS: i3.xlarge; Azure: Standard_DS3_v2)"
    default: i3.xlarge

targets:
  dev:
    default: true
    mode: development
