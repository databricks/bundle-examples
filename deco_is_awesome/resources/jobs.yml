resources:
  jobs:
    daily_etl:
      name: Daily ETL
      tags: {domain: deco, team: data-eng, etl_version: v5}
      trigger:
        periodic: {interval: 1, unit: DAYS}
      tasks:
        - task_key: extract
          existing_cluster_id: "0101-000000-nonexist"
          spark_python_task:
            python_file: ../src/etl.py
            parameters: ["--stage", "extract"]
    metrics_report:
      name: Metrics report
      tags: {domain: deco, team: analytics}
      tasks:
        - task_key: report
          environment_key: default
          spark_python_task:
            python_file: ../src/report.py
      environments:
        - {environment_key: default, spec: {client: "1"}}
