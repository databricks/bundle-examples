[project]
name = "dbt_factory"
version = "0.0.1"
requires-python = ">=3.10,<3.13"
# Used at `bundle deploy` time by resources/__init__.py (to write the serverless
# base-environment file) and by the vendored databricks_dbt_factory core.
dependencies = [
    "PyYAML~=6.0.1",
]

[dependency-groups]
dev = [
    # Required by the PyDABs hook (resources/__init__.py) at `bundle deploy` time.
    "databricks-bundles==1.8.0",
    # Single source of truth for the dbt-databricks version: used locally to generate the
    # manifest (`make manifest`), and resources/__init__.py pins the serverless runtime to this
    # exact installed version at deploy time. Pin/lock it for fully reproducible deploys.
    "dbt-databricks>=1.8.0,<2.0.0",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Only the vendored library is packaged; the dbt project (src/models, ...) is not a package.
[tool.hatch.build.targets.wheel]
packages = ["src/databricks_dbt_factory"]

[tool.ruff]
line-length = 120
