resources:
  jobs:
    example_job:
      name: "Poetry example"
      tasks:
        - task_key: task

          python_wheel_task:
            package_name: python_wheel_poetry
            entry_point: python_wheel_poetry

          libraries:
            - whl: ../dist/*.whl

          new_cluster:
            node_type_id: ${var.node_type_id}
            num_workers: 1
            spark_version: 16.4.x-scala2.12
