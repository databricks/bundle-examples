bundle:
  name: ci_cd_azure_devops
  databricks_cli_version: ">= 1.20.0"

include:
  - resources/*.job.yml

targets:
  dev:
    default: true
    mode: development
    workspace:
      # Give each developer a separate dev copy.
      root_path: /Workspace/bundle-examples/${bundle.name}/${bundle.target}/${workspace.current_user.short_name}
  staging:
    mode: production
    workspace:
      root_path: /Workspace/bundle-examples/${bundle.name}/${bundle.target}
  prod:
    mode: production
    workspace:
      root_path: /Workspace/bundle-examples/${bundle.name}/${bundle.target}
